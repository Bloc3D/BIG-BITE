<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="BIG BITE - menu">
  <title>BIG BITE — Menu</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f7ecd8;
      font-family: Arial, Helvetica, sans-serif;
      color: #111;
    }
    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 18px;
    }
    .menu {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 4px;
    }
    .phone {
      display: block;
      width: fit-content;
      margin: 18px auto 8px;
      padding: 13px 24px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: .5px;
    }
    .phone:hover { opacity: .9; }
    .call-text {
      text-align: center;
      margin: 0 0 12px;
      font-size: 14px;
    }
    @media (max-width: 600px) {
      .page { padding: 8px; }
      .phone { font-size: 18px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <img class="menu" src="menu.jpg" alt="BIG BITE menu">
    <a class="phone" href="tel:+48606439753">📞 606 439 753</a>
    <p class="call-text">Kliknij numer, aby zadzwonić</p>
  </main>
</body>
</html>
